name: ${COMPOSE_PROJECT_NAME:-autobi}

services:
  frontend:
    image: ${FRONTEND_IMAGE:-autobi/frontend:latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_ANALYTICS_API_URL: ${NEXT_PUBLIC_ANALYTICS_API_URL:-http://localhost:8080/api/v1}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_ANALYTICS_API_URL: ${NEXT_PUBLIC_ANALYTICS_API_URL:-http://localhost:8080/api/v1}
      ANALYTICS_INTERNAL_URL: ${ANALYTICS_INTERNAL_URL:-http://backend:8080/api/v1}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      SUPPORT_BFF_SHARED_SECRET: ${SUPPORT_BFF_SHARED_SECRET:?SUPPORT_BFF_SHARED_SECRET must be set}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-autobi/backend:latest}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-AutoBI}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-autobi}
      DB_USERNAME: ${POSTGRES_USER:-autobi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SUPPORT_AI_ADAPTER: ${SUPPORT_AI_ADAPTER:-disabled}
      SUPPORT_GOOGLE_CHAT_MODEL: ${SUPPORT_GOOGLE_CHAT_MODEL:-gemma-4-26b-a4b-it}
      SUPPORT_GOOGLE_EMBEDDING_MODEL: ${SUPPORT_GOOGLE_EMBEDDING_MODEL:-gemini-embedding-2}
      SUPPORT_GOOGLE_EMBEDDING_DIMENSIONS: ${SUPPORT_GOOGLE_EMBEDDING_DIMENSIONS:-768}
      SUPPORT_GOOGLE_THINKING_LEVEL: ${SUPPORT_GOOGLE_THINKING_LEVEL:-minimal}
      SUPPORT_PROMPT_VERSION: ${SUPPORT_PROMPT_VERSION:-support-google-v1}
      SUPPORT_RETRIEVAL_PROFILE: ${SUPPORT_RETRIEVAL_PROFILE:-hybrid-rrf-v2}
      SUPPORT_MINIMUM_RRF_SCORE: ${SUPPORT_MINIMUM_RRF_SCORE:-0.025}
      SUPPORT_MINIMUM_HYBRID_VECTOR_SCORE: ${SUPPORT_MINIMUM_HYBRID_VECTOR_SCORE:-0.65}
      SUPPORT_MINIMUM_SEMANTIC_VECTOR_SCORE: ${SUPPORT_MINIMUM_SEMANTIC_VECTOR_SCORE:-0.70}
      SUPPORT_RETENTION_DAYS: ${SUPPORT_RETENTION_DAYS:-7}
      SUPPORT_BFF_SHARED_SECRET: ${SUPPORT_BFF_SHARED_SECRET:?SUPPORT_BFF_SHARED_SECRET must be set}
      SUPPORT_GENERATION_QUEUE: ${SUPPORT_GENERATION_QUEUE:-ai-generation}
      SUPPORT_INDEXING_QUEUE: ${SUPPORT_INDEXING_QUEUE:-ai-indexing}
      SUPPORT_WORKSPACE_DAILY_TOKEN_BUDGET: ${SUPPORT_WORKSPACE_DAILY_TOKEN_BUDGET:-200000}
      SUPPORT_ENVIRONMENT_DAILY_TOKEN_BUDGET: ${SUPPORT_ENVIRONMENT_DAILY_TOKEN_BUDGET:-1000000}
      SUPPORT_INDEXING_DAILY_TOKEN_BUDGET: ${SUPPORT_INDEXING_DAILY_TOKEN_BUDGET:-500000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  support-generation-worker:
    image: ${BACKEND_IMAGE:-autobi/backend:latest}
    command: ["php", "artisan", "queue:work", "redis", "--queue=ai-generation", "--tries=1", "--timeout=95"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-autobi}
      DB_USERNAME: ${POSTGRES_USER:-autobi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      SUPPORT_AI_ADAPTER: ${SUPPORT_AI_ADAPTER:-disabled}
      SUPPORT_GOOGLE_CHAT_MODEL: ${SUPPORT_GOOGLE_CHAT_MODEL:-gemma-4-26b-a4b-it}
      SUPPORT_GOOGLE_EMBEDDING_MODEL: ${SUPPORT_GOOGLE_EMBEDDING_MODEL:-gemini-embedding-2}
      SUPPORT_GOOGLE_EMBEDDING_DIMENSIONS: ${SUPPORT_GOOGLE_EMBEDDING_DIMENSIONS:-768}
      SUPPORT_GOOGLE_THINKING_LEVEL: ${SUPPORT_GOOGLE_THINKING_LEVEL:-minimal}
      SUPPORT_PROMPT_VERSION: ${SUPPORT_PROMPT_VERSION:-support-google-v1}
      SUPPORT_RETRIEVAL_PROFILE: ${SUPPORT_RETRIEVAL_PROFILE:-hybrid-rrf-v2}
      SUPPORT_MINIMUM_RRF_SCORE: ${SUPPORT_MINIMUM_RRF_SCORE:-0.025}
      SUPPORT_MINIMUM_HYBRID_VECTOR_SCORE: ${SUPPORT_MINIMUM_HYBRID_VECTOR_SCORE:-0.65}
      SUPPORT_MINIMUM_SEMANTIC_VECTOR_SCORE: ${SUPPORT_MINIMUM_SEMANTIC_VECTOR_SCORE:-0.70}
      SUPPORT_WORKSPACE_DAILY_TOKEN_BUDGET: ${SUPPORT_WORKSPACE_DAILY_TOKEN_BUDGET:-200000}
      SUPPORT_ENVIRONMENT_DAILY_TOKEN_BUDGET: ${SUPPORT_ENVIRONMENT_DAILY_TOKEN_BUDGET:-1000000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  support-indexing-worker:
    image: ${BACKEND_IMAGE:-autobi/backend:latest}
    command: ["php", "artisan", "queue:work", "redis", "--queue=ai-indexing", "--tries=3", "--timeout=300"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-autobi}
      DB_USERNAME: ${POSTGRES_USER:-autobi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      SUPPORT_AI_ADAPTER: ${SUPPORT_AI_ADAPTER:-disabled}
      SUPPORT_GOOGLE_EMBEDDING_MODEL: ${SUPPORT_GOOGLE_EMBEDDING_MODEL:-gemini-embedding-2}
      SUPPORT_GOOGLE_EMBEDDING_DIMENSIONS: ${SUPPORT_GOOGLE_EMBEDDING_DIMENSIONS:-768}
      SUPPORT_INDEXING_DAILY_TOKEN_BUDGET: ${SUPPORT_INDEXING_DAILY_TOKEN_BUDGET:-500000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  backend-scheduler:
    image: ${BACKEND_IMAGE:-autobi/backend:latest}
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-autobi}
      DB_USERNAME: ${POSTGRES_USER:-autobi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: ${ANALYTICS_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autobi}
      POSTGRES_USER: ${POSTGRES_USER:-autobi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  notification:
    image: ${NOTIFICATION_IMAGE:-autobi/notification:latest}
    build:
      context: ../notification
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${NOTIFICATION_APP_NAME:-NotificationService}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${NOTIFICATION_APP_KEY:-base64:6Wf3dY1v8s4p2n0m9k7j5h3g1f0d8c6b4a2z1x0w=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${NOTIFICATION_APP_URL:-http://localhost:8081}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: pgsql
      DB_HOST: notification-postgres
      DB_PORT: 5432
      DB_DATABASE: ${NOTIFICATION_POSTGRES_DB:-notification}
      DB_USERNAME: ${NOTIFICATION_POSTGRES_USER:-notification}
      DB_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:-notification}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      INTEGRATION_EVENTS_REDIS_DB: ${INTEGRATION_EVENTS_REDIS_DB:-2}
      INTEGRATION_STREAM_NAME: ${INTEGRATION_STREAM_NAME:-autobi.integration-events}
      INTEGRATION_GROUP_NAME: ${INTEGRATION_GROUP_NAME:-notification-service-v1}
      INTEGRATION_CONSUMER_NAME: notification-http
      INTEGRATION_DEAD_LETTER_STREAM: ${INTEGRATION_DEAD_LETTER_STREAM:-autobi.integration-events.dead-letter}
    ports:
      - "${NOTIFICATION_PORT:-8081}:8081"
    depends_on:
      notification-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:8081/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  notification-worker:
    image: ${NOTIFICATION_IMAGE:-autobi/notification:latest}
    command: ["php", "artisan", "notifications:consume"]
    environment:
      APP_NAME: ${NOTIFICATION_APP_NAME:-NotificationService}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${NOTIFICATION_APP_KEY:-base64:6Wf3dY1v8s4p2n0m9k7j5h3g1f0d8c6b4a2z1x0w=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${NOTIFICATION_APP_URL:-http://localhost:8081}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: pgsql
      DB_HOST: notification-postgres
      DB_PORT: 5432
      DB_DATABASE: ${NOTIFICATION_POSTGRES_DB:-notification}
      DB_USERNAME: ${NOTIFICATION_POSTGRES_USER:-notification}
      DB_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:-notification}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      INTEGRATION_EVENTS_REDIS_DB: ${INTEGRATION_EVENTS_REDIS_DB:-2}
      INTEGRATION_STREAM_NAME: ${INTEGRATION_STREAM_NAME:-autobi.integration-events}
      INTEGRATION_GROUP_NAME: ${INTEGRATION_GROUP_NAME:-notification-service-v1}
      INTEGRATION_CONSUMER_NAME: notification-worker-1
      INTEGRATION_DEAD_LETTER_STREAM: ${INTEGRATION_DEAD_LETTER_STREAM:-autobi.integration-events.dead-letter}
    depends_on:
      notification-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  notification-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-notification}
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:-notification}
    ports:
      - "${NOTIFICATION_POSTGRES_PORT:-5433}:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  notification-postgres-data:
  redis-data:
