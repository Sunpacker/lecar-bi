name: ${COMPOSE_PROJECT_NAME:-autobi}

services:
  frontend:
    image: ${FRONTEND_IMAGE:-autobi/frontend:latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_ANALYTICS_API_URL: ${NEXT_PUBLIC_ANALYTICS_API_URL:-http://localhost:8080/api/v1}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ANALYTICS_INTERNAL_URL: ${ANALYTICS_INTERNAL_URL:-http://backend:8080/api/v2}
      NOTIFICATION_INTERNAL_URL: ${NOTIFICATION_INTERNAL_URL:-http://notification:8081/api/v1}
      NOTIFICATION_SHARED_SECRET: ${NOTIFICATION_SHARED_SECRET:-test-notification-secret-key-12345}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-autobi/backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-AutoBI}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-autobi}
      DB_USERNAME: ${POSTGRES_USER:-autobi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      ANALYTICS_CACHE_ENABLED: ${ANALYTICS_CACHE_ENABLED:-true}
      ANALYTICS_CACHE_SCHEMA_VERSION: ${ANALYTICS_CACHE_SCHEMA_VERSION:-1}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend-worker:
    image: ${BACKEND_IMAGE:-autobi/backend:latest}
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,mail", "--tries=3"]
    environment:
      APP_NAME: ${APP_NAME:-AutoBI}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-autobi}
      DB_USERNAME: ${POSTGRES_USER:-autobi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autobi}
      POSTGRES_USER: ${POSTGRES_USER:-autobi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  notification:
    image: ${NOTIFICATION_IMAGE:-autobi/notification:latest}
    build:
      context: ../notification
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${NOTIFICATION_APP_NAME:-NotificationService}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${NOTIFICATION_APP_KEY:?NOTIFICATION_APP_KEY must be set}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${NOTIFICATION_APP_URL:-http://localhost:8081}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: pgsql
      DB_HOST: notification-postgres
      DB_PORT: 5432
      DB_DATABASE: ${NOTIFICATION_POSTGRES_DB:-notification}
      DB_USERNAME: ${NOTIFICATION_POSTGRES_USER:-notification}
      DB_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:?NOTIFICATION_POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      INTEGRATION_EVENTS_REDIS_DB: ${INTEGRATION_EVENTS_REDIS_DB:-2}
      INTEGRATION_STREAM_NAME: ${INTEGRATION_STREAM_NAME:-autobi.integration-events}
      INTEGRATION_GROUP_NAME: ${INTEGRATION_GROUP_NAME:-notification-service-v1}
      INTEGRATION_CONSUMER_NAME: notification-http
      INTEGRATION_DEAD_LETTER_STREAM: ${INTEGRATION_DEAD_LETTER_STREAM:-autobi.integration-events.dead-letter}
    ports:
      - "${NOTIFICATION_PORT:-8081}:8081"
    depends_on:
      notification-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:8081/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  notification-worker:
    image: ${NOTIFICATION_IMAGE:-autobi/notification:latest}
    command: ["php", "artisan", "notifications:consume"]
    environment:
      APP_NAME: ${NOTIFICATION_APP_NAME:-NotificationService}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${NOTIFICATION_APP_KEY:?NOTIFICATION_APP_KEY must be set}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${NOTIFICATION_APP_URL:-http://localhost:8081}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: pgsql
      DB_HOST: notification-postgres
      DB_PORT: 5432
      DB_DATABASE: ${NOTIFICATION_POSTGRES_DB:-notification}
      DB_USERNAME: ${NOTIFICATION_POSTGRES_USER:-notification}
      DB_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:?NOTIFICATION_POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      INTEGRATION_EVENTS_REDIS_DB: ${INTEGRATION_EVENTS_REDIS_DB:-2}
      INTEGRATION_STREAM_NAME: ${INTEGRATION_STREAM_NAME:-autobi.integration-events}
      INTEGRATION_GROUP_NAME: ${INTEGRATION_GROUP_NAME:-notification-service-v1}
      INTEGRATION_CONSUMER_NAME: notification-worker-1
      INTEGRATION_DEAD_LETTER_STREAM: ${INTEGRATION_DEAD_LETTER_STREAM:-autobi.integration-events.dead-letter}
    depends_on:
      notification-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "php artisan notifications:worker-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  notification-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-notification}
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:-notification}
    ports:
      - "${NOTIFICATION_POSTGRES_PORT:-5433}:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.1.1}
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.3.1}
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  postgres-data:
  notification-postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:

