name: ${COMPOSE_PROJECT_NAME:-lecar-bi}

services:
  backend:
    image: ${BACKEND_IMAGE:-lecar-bi/backend:latest}

    build:
      context: ../backend
      dockerfile: Dockerfile

    environment:
      APP_NAME: ${APP_NAME:-Lecar BI}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://api.veloza.ru/lecar-bi}

      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-lecar_bi}
      DB_USERNAME: ${POSTGRES_USER:-lecar_bi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      internal:
      proxy:
        aliases:
          - lecar-bi-backend

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lecar_bi}
      POSTGRES_USER: ${POSTGRES_USER:-lecar_bi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - internal

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    networks:
      - internal

volumes:
  postgres-data:
  redis-data:

networks:
  internal:
    driver: bridge
    internal: true
  proxy:
    external: true
    name: ${CADDY_NETWORK:-proxy}
