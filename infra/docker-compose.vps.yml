name: ${COMPOSE_PROJECT_NAME:-lecar-bi}

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set to an immutable GHCR image}

    environment:
      APP_NAME: ${APP_NAME:-Lecar BI}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://api.veloza.ru/lecar-bi}

      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-lecar_bi}
      DB_USERNAME: ${POSTGRES_USER:-lecar_bi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      ANALYTICS_CACHE_ENABLED: ${ANALYTICS_CACHE_ENABLED:-true}
      ANALYTICS_CACHE_SCHEMA_VERSION: ${ANALYTICS_CACHE_SCHEMA_VERSION:-1}

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      internal:
      proxy:
        aliases:
          - lecar-bi-backend

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lecar_bi}
      POSTGRES_USER: ${POSTGRES_USER:-lecar_bi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - internal

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    networks:
      - internal

  notification:
    image: ${NOTIFICATION_IMAGE:?NOTIFICATION_IMAGE must be set to an immutable GHCR image}
    environment:
      APP_NAME: ${NOTIFICATION_APP_NAME:-Lecar Notification}
      APP_ENV: production
      APP_KEY: ${NOTIFICATION_APP_KEY:?NOTIFICATION_APP_KEY must be set}
      APP_DEBUG: "false"
      APP_URL: ${NOTIFICATION_APP_URL:-http://localhost:8081}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: notification-postgres
      DB_PORT: 5432
      DB_DATABASE: ${NOTIFICATION_POSTGRES_DB:-lecar_notification}
      DB_USERNAME: ${NOTIFICATION_POSTGRES_USER:-lecar_notification}
      DB_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:?NOTIFICATION_POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTEGRATION_EVENTS_REDIS_DB: ${INTEGRATION_EVENTS_REDIS_DB:-2}
      INTEGRATION_STREAM_NAME: ${INTEGRATION_STREAM_NAME:-autobi.integration-events}
      INTEGRATION_GROUP_NAME: ${INTEGRATION_GROUP_NAME:-notification-service-v1}
      INTEGRATION_CONSUMER_NAME: notification-http
      INTEGRATION_DEAD_LETTER_STREAM: ${INTEGRATION_DEAD_LETTER_STREAM:-autobi.integration-events.dead-letter}
    expose:
      - "8081"
    depends_on:
      notification-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal

  notification-worker:
    image: ${NOTIFICATION_IMAGE:?NOTIFICATION_IMAGE must be set to an immutable GHCR image}
    command: ["php", "artisan", "notifications:consume"]
    environment:
      APP_NAME: ${NOTIFICATION_APP_NAME:-Lecar Notification}
      APP_ENV: production
      APP_KEY: ${NOTIFICATION_APP_KEY:?NOTIFICATION_APP_KEY must be set}
      APP_DEBUG: "false"
      APP_URL: ${NOTIFICATION_APP_URL:-http://localhost:8081}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: notification-postgres
      DB_PORT: 5432
      DB_DATABASE: ${NOTIFICATION_POSTGRES_DB:-lecar_notification}
      DB_USERNAME: ${NOTIFICATION_POSTGRES_USER:-lecar_notification}
      DB_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:?NOTIFICATION_POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTEGRATION_EVENTS_REDIS_DB: ${INTEGRATION_EVENTS_REDIS_DB:-2}
      INTEGRATION_STREAM_NAME: ${INTEGRATION_STREAM_NAME:-autobi.integration-events}
      INTEGRATION_GROUP_NAME: ${INTEGRATION_GROUP_NAME:-notification-service-v1}
      INTEGRATION_CONSUMER_NAME: notification-worker-1
      INTEGRATION_DEAD_LETTER_STREAM: ${INTEGRATION_DEAD_LETTER_STREAM:-autobi.integration-events.dead-letter}
    depends_on:
      notification-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "php artisan notifications:worker-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal

  notification-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-lecar_notification}
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER:-lecar_notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:?NOTIFICATION_POSTGRES_PASSWORD must be set}
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - internal

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.1.1}
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - internal

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.3.1}
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - internal

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres-data:
  notification-postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  internal:
    driver: bridge
    internal: true
  proxy:
    external: true
    name: ${CADDY_NETWORK:-proxy}
