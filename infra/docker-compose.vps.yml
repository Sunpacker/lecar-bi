name: ${COMPOSE_PROJECT_NAME:-lecar-bi}

services:
  backend:
    image: ${BACKEND_IMAGE:-lecar-bi/backend:latest}

    build:
      context: ..
      dockerfile: backend/Dockerfile

    environment:
      APP_NAME: ${APP_NAME:-Lecar BI}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://api.veloza.ru/lecar-bi}

      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-lecar_bi}
      DB_USERNAME: ${POSTGRES_USER:-lecar_bi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      OUTBOX_REDIS_DB: ${INTEGRATION_EVENTS_REDIS_DB:-2}
      OUTBOX_STREAM_NAME: ${INTEGRATION_STREAM_NAME:-autobi.integration-events}
      SUPPORT_AI_ADAPTER: ${SUPPORT_AI_ADAPTER:-disabled}
      GEMMA_API_KEY: ${GEMMA_API_KEY:-}
      SUPPORT_GOOGLE_CHAT_MODEL: ${SUPPORT_GOOGLE_CHAT_MODEL:-gemma-4-26b-a4b-it}
      SUPPORT_GOOGLE_EMBEDDING_MODEL: ${SUPPORT_GOOGLE_EMBEDDING_MODEL:-gemini-embedding-2}
      SUPPORT_GOOGLE_EMBEDDING_DIMENSIONS: ${SUPPORT_GOOGLE_EMBEDDING_DIMENSIONS:-768}
      SUPPORT_GOOGLE_THINKING_LEVEL: ${SUPPORT_GOOGLE_THINKING_LEVEL:-minimal}
      SUPPORT_PROMPT_VERSION: ${SUPPORT_PROMPT_VERSION:-support-google-v1}
      SUPPORT_RETRIEVAL_PROFILE: ${SUPPORT_RETRIEVAL_PROFILE:-hybrid-rrf-v2}
      SUPPORT_MINIMUM_RRF_SCORE: ${SUPPORT_MINIMUM_RRF_SCORE:-0.025}
      SUPPORT_MINIMUM_HYBRID_VECTOR_SCORE: ${SUPPORT_MINIMUM_HYBRID_VECTOR_SCORE:-0.65}
      SUPPORT_MINIMUM_SEMANTIC_VECTOR_SCORE: ${SUPPORT_MINIMUM_SEMANTIC_VECTOR_SCORE:-0.70}
      SUPPORT_RETENTION_DAYS: ${SUPPORT_RETENTION_DAYS:-7}
      SUPPORT_BFF_SHARED_SECRET: ${SUPPORT_BFF_SHARED_SECRET:?SUPPORT_BFF_SHARED_SECRET must be set}
      SUPPORT_GENERATION_QUEUE: ${SUPPORT_GENERATION_QUEUE:-ai-generation}
      SUPPORT_INDEXING_QUEUE: ${SUPPORT_INDEXING_QUEUE:-ai-indexing}
      SUPPORT_WORKSPACE_DAILY_TOKEN_BUDGET: ${SUPPORT_WORKSPACE_DAILY_TOKEN_BUDGET:-200000}
      SUPPORT_ENVIRONMENT_DAILY_TOKEN_BUDGET: ${SUPPORT_ENVIRONMENT_DAILY_TOKEN_BUDGET:-1000000}
      SUPPORT_INDEXING_DAILY_TOKEN_BUDGET: ${SUPPORT_INDEXING_DAILY_TOKEN_BUDGET:-500000}

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      internal:
      proxy:
        aliases:
          - lecar-bi-backend

  support-generation-worker:
    image: ${BACKEND_IMAGE:-lecar-bi/backend:latest}
    command: ["php", "artisan", "queue:work", "redis", "--queue=ai-generation", "--tries=1", "--timeout=95"]
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_DEBUG: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-lecar_bi}
      DB_USERNAME: ${POSTGRES_USER:-lecar_bi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      SUPPORT_AI_ADAPTER: ${SUPPORT_AI_ADAPTER:-disabled}
      GEMMA_API_KEY: ${GEMMA_API_KEY:-}
      SUPPORT_GOOGLE_CHAT_MODEL: ${SUPPORT_GOOGLE_CHAT_MODEL:-gemma-4-26b-a4b-it}
      SUPPORT_GOOGLE_EMBEDDING_MODEL: ${SUPPORT_GOOGLE_EMBEDDING_MODEL:-gemini-embedding-2}
      SUPPORT_GOOGLE_EMBEDDING_DIMENSIONS: ${SUPPORT_GOOGLE_EMBEDDING_DIMENSIONS:-768}
      SUPPORT_GOOGLE_THINKING_LEVEL: ${SUPPORT_GOOGLE_THINKING_LEVEL:-minimal}
      SUPPORT_PROMPT_VERSION: ${SUPPORT_PROMPT_VERSION:-support-google-v1}
      SUPPORT_RETRIEVAL_PROFILE: ${SUPPORT_RETRIEVAL_PROFILE:-hybrid-rrf-v2}
      SUPPORT_MINIMUM_RRF_SCORE: ${SUPPORT_MINIMUM_RRF_SCORE:-0.025}
      SUPPORT_MINIMUM_HYBRID_VECTOR_SCORE: ${SUPPORT_MINIMUM_HYBRID_VECTOR_SCORE:-0.65}
      SUPPORT_MINIMUM_SEMANTIC_VECTOR_SCORE: ${SUPPORT_MINIMUM_SEMANTIC_VECTOR_SCORE:-0.70}
      SUPPORT_GENERATION_QUEUE: ${SUPPORT_GENERATION_QUEUE:-ai-generation}
      SUPPORT_WORKSPACE_DAILY_TOKEN_BUDGET: ${SUPPORT_WORKSPACE_DAILY_TOKEN_BUDGET:-200000}
      SUPPORT_ENVIRONMENT_DAILY_TOKEN_BUDGET: ${SUPPORT_ENVIRONMENT_DAILY_TOKEN_BUDGET:-1000000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  support-indexing-worker:
    image: ${BACKEND_IMAGE:-lecar-bi/backend:latest}
    command: ["php", "artisan", "queue:work", "redis", "--queue=ai-indexing", "--tries=3", "--timeout=300"]
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_DEBUG: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-lecar_bi}
      DB_USERNAME: ${POSTGRES_USER:-lecar_bi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      SUPPORT_AI_ADAPTER: ${SUPPORT_AI_ADAPTER:-disabled}
      GEMMA_API_KEY: ${GEMMA_API_KEY:-}
      SUPPORT_GOOGLE_EMBEDDING_MODEL: ${SUPPORT_GOOGLE_EMBEDDING_MODEL:-gemini-embedding-2}
      SUPPORT_GOOGLE_EMBEDDING_DIMENSIONS: ${SUPPORT_GOOGLE_EMBEDDING_DIMENSIONS:-768}
      SUPPORT_INDEXING_QUEUE: ${SUPPORT_INDEXING_QUEUE:-ai-indexing}
      SUPPORT_INDEXING_DAILY_TOKEN_BUDGET: ${SUPPORT_INDEXING_DAILY_TOKEN_BUDGET:-500000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  backend-scheduler:
    image: ${BACKEND_IMAGE:-lecar-bi/backend:latest}
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_DEBUG: "false"
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-lecar_bi}
      DB_USERNAME: ${POSTGRES_USER:-lecar_bi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: ${ANALYTICS_POSTGRES_IMAGE:-pgvector/pgvector:pg16}

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lecar_bi}
      POSTGRES_USER: ${POSTGRES_USER:-lecar_bi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - internal

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    networks:
      - internal

  notification:
    image: ${NOTIFICATION_IMAGE:-lecar-bi/notification:latest}
    build:
      context: ../notification
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${NOTIFICATION_APP_NAME:-Lecar Notification}
      APP_ENV: production
      APP_KEY: ${NOTIFICATION_APP_KEY:?NOTIFICATION_APP_KEY must be set}
      APP_DEBUG: "false"
      APP_URL: ${NOTIFICATION_APP_URL:-http://localhost:8081}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: notification-postgres
      DB_PORT: 5432
      DB_DATABASE: ${NOTIFICATION_POSTGRES_DB:-lecar_notification}
      DB_USERNAME: ${NOTIFICATION_POSTGRES_USER:-lecar_notification}
      DB_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:?NOTIFICATION_POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      INTEGRATION_EVENTS_REDIS_DB: ${INTEGRATION_EVENTS_REDIS_DB:-2}
      INTEGRATION_STREAM_NAME: ${INTEGRATION_STREAM_NAME:-autobi.integration-events}
      INTEGRATION_GROUP_NAME: ${INTEGRATION_GROUP_NAME:-notification-service-v1}
      INTEGRATION_CONSUMER_NAME: notification-http
      INTEGRATION_DEAD_LETTER_STREAM: ${INTEGRATION_DEAD_LETTER_STREAM:-autobi.integration-events.dead-letter}
    expose:
      - "8081"
    depends_on:
      notification-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal

  notification-worker:
    image: ${NOTIFICATION_IMAGE:-lecar-bi/notification:latest}
    command: ["php", "artisan", "notifications:consume"]
    environment:
      APP_NAME: ${NOTIFICATION_APP_NAME:-Lecar Notification}
      APP_ENV: production
      APP_KEY: ${NOTIFICATION_APP_KEY:?NOTIFICATION_APP_KEY must be set}
      APP_DEBUG: "false"
      APP_URL: ${NOTIFICATION_APP_URL:-http://localhost:8081}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: notification-postgres
      DB_PORT: 5432
      DB_DATABASE: ${NOTIFICATION_POSTGRES_DB:-lecar_notification}
      DB_USERNAME: ${NOTIFICATION_POSTGRES_USER:-lecar_notification}
      DB_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:?NOTIFICATION_POSTGRES_PASSWORD must be set}
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      INTEGRATION_EVENTS_REDIS_DB: ${INTEGRATION_EVENTS_REDIS_DB:-2}
      INTEGRATION_STREAM_NAME: ${INTEGRATION_STREAM_NAME:-autobi.integration-events}
      INTEGRATION_GROUP_NAME: ${INTEGRATION_GROUP_NAME:-notification-service-v1}
      INTEGRATION_CONSUMER_NAME: notification-worker-1
      INTEGRATION_DEAD_LETTER_STREAM: ${INTEGRATION_DEAD_LETTER_STREAM:-autobi.integration-events.dead-letter}
    depends_on:
      notification-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  notification-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-lecar_notification}
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER:-lecar_notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:?NOTIFICATION_POSTGRES_PASSWORD must be set}
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres-data:
  notification-postgres-data:
  redis-data:

networks:
  internal:
    driver: bridge
    internal: true
  proxy:
    external: true
    name: ${CADDY_NETWORK:-proxy}
