global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: "analytics"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: "analytics"

  - job_name: "notification"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["notification:8081"]
        labels:
          service: "notification"
