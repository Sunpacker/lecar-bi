services:
  frontend:
    image: ${FRONTEND_DEV_IMAGE:-autobi/frontend:dev}
    build:
      target: development
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next

  notification:
    volumes:
      - ../notification:/var/www/html
      - ../notification/vendor:/var/www/html/vendor

  notification-worker:
    volumes:
      - ../notification:/var/www/html
      - ../notification/vendor:/var/www/html/vendor

volumes:
  frontend-node-modules:
  frontend-next-cache:
