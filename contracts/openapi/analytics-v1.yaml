components:
  securitySchemes:
    UserIdAuth:
      type: apiKey
      in: header
      name: X-User-Id
      description: Authenticated user identifier
  schemas:

    DatasetType:
      type: string
      enum: [sales, inventory]
    ImportStatus:
      type: string
      enum: [pending, validating, processing, completed, completed_with_errors, failed]
    SourceFormat:
      type: string
      enum: [csv, json]
    ImportBatchSummary:
      type: object
      required: [id, workspace_id, dataset_type, source_format, original_filename, status, total_rows, processed_rows, successful_rows, failed_rows, created_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        dataset_type:
          $ref: '#/components/schemas/DatasetType'
        source_format:
          $ref: '#/components/schemas/SourceFormat'
        original_filename:
          type: string
        status:
          $ref: '#/components/schemas/ImportStatus'
        total_rows:
          type: integer
        processed_rows:
          type: integer
        successful_rows:
          type: integer
        failed_rows:
          type: integer
        progress_percentage:
          type: number
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    ImportBatchListResponse:
      type: object
      required: [items, total, page, per_page, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportBatchSummary'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
      additionalProperties: false
    ImportBatchDetail:
      type: object
      required: [id, workspace_id, dataset_type, source_format, original_filename, status, total_rows, processed_rows, successful_rows, failed_rows, stored_file_path, created_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        dataset_type:
          $ref: '#/components/schemas/DatasetType'
        source_format:
          $ref: '#/components/schemas/SourceFormat'
        original_filename:
          type: string
        status:
          $ref: '#/components/schemas/ImportStatus'
        total_rows:
          type: integer
        processed_rows:
          type: integer
        successful_rows:
          type: integer
        failed_rows:
          type: integer
        progress_percentage:
          type: number
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        stored_file_path:
          type: string
      additionalProperties: false
    ImportBatchDetailResponse:
      type: object
      required: [batch]
      properties:
        batch:
          $ref: '#/components/schemas/ImportBatchDetail'
      additionalProperties: false
    ImportFailureItem:
      type: object
      required: [id, row_number, error_message, created_at]
      properties:
        id:
          type: string
        row_number:
          type: integer
        field:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    ImportFailureListResponse:
      type: object
      required: [items, total, page, per_page, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportFailureItem'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
      additionalProperties: false
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [analytics] }
        version: { type: string, enum: [v1] }
    UserResponse:
      type: object
      additionalProperties: false
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    WorkspaceResponse:
      type: object
      additionalProperties: false
      required: [id, name, slug, role]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, member] }
    WorkspaceListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceResponse'
    CurrentWorkspaceResponse:
      type: object
      additionalProperties: false
      required: [user, workspace]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        workspace:
          $ref: '#/components/schemas/WorkspaceResponse'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string }
    SalesOverviewResponse:
      type: object
      additionalProperties: false
      required: [summary, trend, categories, regions]
      properties:
        summary:
          $ref: '#/components/schemas/SalesSummary'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/SalesTrendPoint'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SalesCategoryBreakdown'
        regions:
          type: array
          items:
            $ref: '#/components/schemas/SalesRegionBreakdown'
    SalesSummary:
      type: object
      additionalProperties: false
      required: [total_revenue, order_count, average_order_value, gross_profit, margin_rate]
      properties:
        total_revenue: { type: number, format: float }
        order_count: { type: integer }
        average_order_value: { type: number, format: float }
        gross_profit: { type: number, format: float }
        margin_rate: { type: number, format: float }
    SalesTrendPoint:
      type: object
      additionalProperties: false
      required: [date, revenue, order_count]
      properties:
        date: { type: string, format: date }
        revenue: { type: number, format: float }
        order_count: { type: integer }
    SalesCategoryBreakdown:
      type: object
      additionalProperties: false
      required: [category_id, category_name, revenue, order_count, revenue_share]
      properties:
        category_id: { type: string }
        category_name: { type: string }
        revenue: { type: number, format: float }
        order_count: { type: integer }
        revenue_share: { type: number, format: float }
    SalesRegionBreakdown:
      type: object
      additionalProperties: false
      required: [region_id, region_name, region_code, revenue, order_count, revenue_share]
      properties:
        region_id: { type: string }
        region_name: { type: string }
        region_code: { type: string }
        revenue: { type: number, format: float }
        order_count: { type: integer }
        revenue_share: { type: number, format: float }
    SalesFilterOptionsResponse:
      type: object
      additionalProperties: false
      required: [categories, regions, min_date, max_date]
      properties:
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        regions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, code]
            properties:
              id: { type: string }
              name: { type: string }
              code: { type: string }
        min_date: { type: string, format: date }
        max_date: { type: string, format: date }
    PaginationMetadata:
      type: object
      additionalProperties: false
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    SalesRecordItem:
      type: object
      additionalProperties: false
      required: [id, order_id, order_number, order_date, product_id, product_name, product_sku, category_id, category_name, region_id, region_name, brand_name, quantity, unit_price, total_price, gross_profit, status]
      properties:
        id: { type: string }
        order_id: { type: string }
        order_number: { type: string }
        order_date: { type: string, format: date }
        product_id: { type: string }
        product_name: { type: string }
        product_sku: { type: string }
        category_id: { type: string }
        category_name: { type: string }
        region_id: { type: string }
        region_name: { type: string }
        brand_name: { type: string }
        quantity: { type: integer }
        unit_price: { type: number, format: float }
        total_price: { type: number, format: float }
        gross_profit: { type: number, format: float }
        status: { type: string }
    SalesRecordsResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesRecordItem'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
    InventorySummary:
      type: object
      additionalProperties: false
      required:
        - total_items
        - total_quantity_on_hand
        - total_quantity_reserved
        - total_quantity_available
        - total_inventory_value
        - critical_count
        - overstock_count
        - out_of_stock_count
        - optimal_count
        - average_days_of_stock
      properties:
        total_items:
          type: integer
        total_quantity_on_hand:
          type: integer
        total_quantity_reserved:
          type: integer
        total_quantity_available:
          type: integer
        total_inventory_value:
          type: number
          format: float
        critical_count:
          type: integer
        overstock_count:
          type: integer
        out_of_stock_count:
          type: integer
        optimal_count:
          type: integer
        average_days_of_stock:
