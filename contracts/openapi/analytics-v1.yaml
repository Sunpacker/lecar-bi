openapi: 3.0.3
info:
  title: AutoBI Analytics API
  version: 1.0.0
  description: Public API boundary for AutoBI analytics service.
  license:
    name: Proprietary
servers:
  - url: /api/v1
security:
  - UserIdAuth: []
paths:
  /imports:
    get:
      operationId: getImportBatches
      x-required-capability: imports.view
      summary: List data ingestion batches for workspace
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 20
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/ImportStatus'
        - in: query
          name: dataset_type
          required: false
          schema:
            $ref: '#/components/schemas/DatasetType'
      responses:
        '200':
          description: List of import batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: uploadImportBatch
      x-required-capability: imports.manage
      summary: Upload data ingestion file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - dataset_type
              properties:
                file:
                  type: string
                  format: binary
                dataset_type:
                  $ref: '#/components/schemas/DatasetType'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchDetailResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /imports/{id}:
    get:
      operationId: getImportBatch
      x-required-capability: imports.view
      summary: Get import batch details and progress
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Import batch detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchDetailResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /imports/{id}/failures:
    get:
      operationId: getImportFailures
      x-required-capability: imports.view
      summary: List validation failure rows for import batch
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFailureListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /imports/{id}/retry:
    post:
      operationId: retryImportBatch
      x-required-capability: imports.manage
      summary: Retry failed or incomplete import batch
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchDetailResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      operationId: getHealth
      summary: Technical health check
      security: []
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate user with credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me:
    get:
      operationId: getCurrentUser
      summary: Get current authenticated user profile
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid user identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces:
    get:
      operationId: listAccessibleWorkspaces
      summary: List all workspaces accessible by the current user
      responses:
        '200':
          description: List of accessible workspaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/current:
    get:
      operationId: getCurrentWorkspace
      summary: Get currently selected workspace for the user
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
      responses:
        '200':
          description: Current workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentWorkspaceResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - user does not belong to the requested workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{id}:
    get:
      operationId: getWorkspaceById
      summary: Get workspace details by identifier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Workspace identifier
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - cross-workspace access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/members:
    get:
      operationId: getWorkspaceMembers
      summary: List members of the workspace
      x-required-capability: workspace.members.manage
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
          description: Workspace identifier
      responses:
        '200':
          description: List of workspace members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient capability or cross-workspace access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{workspaceId}/members/{userId}/role:
    patch:
      operationId: changeWorkspaceMemberRole
      summary: Change the role of an existing workspace member
      x-required-capability: workspace.members.manage
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
          description: Workspace identifier
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: User identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeWorkspaceMemberRoleRequest'
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeWorkspaceMemberRoleResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient capability or cross-workspace access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - cannot demote the last workspace owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/sales/overview:
    get:
      operationId: getSalesOverview
      x-required-capability: analytics.view
      summary: Get aggregated sales summary, trends, and breakdowns
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
        - in: query
          name: date_from
          required: false
          schema:
            type: string
            format: date
          description: Start of date filter range (YYYY-MM-DD)
        - in: query
          name: date_to
          required: false
          schema:
            type: string
            format: date
          description: End of date filter range (YYYY-MM-DD)
        - in: query
          name: category_id
          required: false
          schema:
            type: string
          description: Filter by specific category ID
        - in: query
          name: region_id
          required: false
          schema:
            type: string
          description: Filter by specific region ID
      responses:
        '200':
          description: Aggregated sales overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOverviewResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/sales/filters:
    get:
      operationId: getSalesFilterOptions
      x-required-capability: analytics.view
      summary: Get available categories, regions, and date boundaries for sales filters
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
      responses:
        '200':
          description: Filter options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesFilterOptionsResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/sales/records:
    get:
      operationId: getSalesRecords
      x-required-capability: analytics.view
      summary: Get paginated and sorted detail sales records for drill-down
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
        - in: query
          name: date_from
          required: false
          schema:
            type: string
            format: date
          description: Start of date filter range (YYYY-MM-DD)
        - in: query
          name: date_to
          required: false
          schema:
            type: string
            format: date
          description: End of date filter range (YYYY-MM-DD)
        - in: query
          name: category_id
          required: false
          schema:
            type: string
          description: Filter by specific category ID
        - in: query
          name: region_id
          required: false
          schema:
            type: string
          description: Filter by specific region ID
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page
        - in: query
          name: sort_by
          required: false
          schema:
            type: string
            enum: [order_date, order_number, product_name, total_price, quantity, gross_profit]
            default: order_date
          description: Field to sort records by
        - in: query
          name: sort_direction
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction
      responses:
        '200':
          description: Paginated detail sales records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesRecordsResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/inventory/summary:
    get:
      operationId: getInventorySummary
      x-required-capability: analytics.view
      summary: Get current inventory summary, health breakdown, and warehouse metrics
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
        - in: query
          name: warehouse_id
          required: false
          schema:
            type: string
          description: Optional filter by warehouse ID
        - in: query
          name: as_of_date
          required: false
          schema:
            type: string
            format: date
          description: Optional snapshot date (YYYY-MM-DD), defaults to latest available snapshot
      responses:
        '200':
          description: Aggregated inventory summary and health distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySummaryResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - user does not belong to the requested workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/inventory/items:
    get:
      operationId: getInventoryItems
      x-required-capability: analytics.view
      summary: Get paginated and sorted list of inventory items with sales velocity, DOS, and stock health
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
        - in: query
          name: warehouse_id
          required: false
          schema:
            type: string
          description: Filter by warehouse ID
        - in: query
          name: stock_health
          required: false
          schema:
            type: string
            enum: [out_of_stock, critical, optimal, overstock]
          description: Filter by stock health status
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search by product name or SKU
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page
        - in: query
          name: sort_by
          required: false
          schema:
            type: string
            enum: [product_name, quantity_on_hand, quantity_available, inventory_value, sales_velocity, days_of_stock]
            default: quantity_available
          description: Sort field
        - in: query
          name: sort_direction
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort direction
      responses:
        '200':
          description: Paginated inventory items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemsResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/inventory/filters:
    get:
      operationId: getInventoryFilters
      x-required-capability: analytics.view
      summary: Get available filter options for inventory analytics
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
      responses:
        '200':
          description: Available inventory filter options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryFilterOptionsResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/inventory/abc-xyz/summary:
    get:
      operationId: getAbcXyzSummary
      x-required-capability: analytics.view
      summary: Get ABC/XYZ combined matrix and summary metrics
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
        - in: query
          name: period_days
          required: false
          schema:
            type: integer
            enum: [30, 90, 180, 365]
            default: 90
          description: Analysis period in days
        - in: query
          name: warehouse_id
          required: false
          schema:
            type: string
          description: Optional filter by warehouse ID
        - in: query
          name: category_id
          required: false
          schema:
            type: string
          description: Optional filter by category ID
        - in: query
          name: supplier_id
          required: false
          schema:
            type: string
          description: Optional filter by supplier ID
      responses:
        '200':
          description: ABC/XYZ matrix and summary distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbcXyzSummaryResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/inventory/abc-xyz/items:
    get:
      operationId: getAbcXyzItems
      x-required-capability: analytics.view
      summary: Get product-level items for ABC/XYZ analysis with variation and shares
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
        - in: query
          name: period_days
          required: false
          schema:
            type: integer
            enum: [30, 90, 180, 365]
            default: 90
          description: Analysis period in days
        - in: query
          name: warehouse_id
          required: false
          schema:
            type: string
          description: Optional filter by warehouse ID
        - in: query
          name: category_id
          required: false
          schema:
            type: string
          description: Optional filter by category ID
        - in: query
          name: supplier_id
          required: false
          schema:
            type: string
          description: Optional filter by supplier ID
        - in: query
          name: abc_class
          required: false
          schema:
            type: string
            enum: [A, B, C]
          description: Optional filter by ABC class
        - in: query
          name: xyz_class
          required: false
          schema:
            type: string
            enum: [X, Y, Z]
          description: Optional filter by XYZ class
        - in: query
          name: group
          required: false
          schema:
            type: string
            enum: [AX, AY, AZ, BX, BY, BZ, CX, CY, CZ]
          description: Optional filter by matrix group
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search by product name or SKU
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Items per page
        - in: query
          name: sort_by
          required: false
          schema:
            type: string
            enum: [product_name, total_revenue, revenue_share, cumulative_revenue_share, total_units_sold, coefficient_of_variation, current_stock, inventory_value]
            default: total_revenue
          description: Sort column
        - in: query
          name: sort_direction
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction
      responses:
        '200':
          description: Paginated product-level ABC/XYZ items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbcXyzItemsResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/suppliers/overview:
    get:
      operationId: getSupplierOverview
      x-required-capability: analytics.view
      summary: Get aggregated supplier metrics overview, delivery trends, and status breakdown
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
        - in: query
          name: date_from
          required: false
          schema:
            type: string
            format: date
          description: Start of date filter range (YYYY-MM-DD)
        - in: query
          name: date_to
          required: false
          schema:
            type: string
            format: date
          description: End of date filter range (YYYY-MM-DD)
        - in: query
          name: supplier_id
          required: false
          schema:
            type: string
          description: Filter by supplier ID
