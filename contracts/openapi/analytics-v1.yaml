                $ref: '#/components/schemas/AlertListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/summary:
    get:
      operationId: getAlertSummary
      x-required-capability: alerts.view
      summary: Get active alert counts by severity and status
      responses:
        '200':
          description: Alert summary counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSummaryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/{id}:
    get:
      operationId: getAlertById
      x-required-capability: alerts.view
      summary: Get alert details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alert details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetailResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      x-required-capability: alerts.manage
      summary: Acknowledge active alert
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alert acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetailResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict with alert lifecycle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/{id}/resolve:
    post:
      operationId: resolveAlert
      x-required-capability: alerts.manage
      summary: Resolve alert
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution_note:
                  type: string
      responses:
        '200':
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetailResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict with alert lifecycle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /support/conversations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdHeader'
    post:
      operationId: createSupportConversation
      summary: Create a private support conversation
      x-required-capability: support.use
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportConversationRequest'
      responses:
        '201':
          description: Conversation created or an idempotent result returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportConversationResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      operationId: listSupportConversations
      summary: List the current user's conversations in the current workspace
      x-required-capability: support.use
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Cursor-paginated conversations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportConversationListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /support/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/SupportResourceId'
      - $ref: '#/components/parameters/WorkspaceIdHeader'
    get:
      operationId: getSupportConversation
      summary: Get an owned support conversation
      x-required-capability: support.use
      responses:
        '200':
          description: Conversation metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportConversationResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSupportConversation
      summary: Revoke access and schedule cleanup of an owned conversation
      x-required-capability: support.use
      responses:
        '204': { description: Conversation deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/SupportResourceId'
      - $ref: '#/components/parameters/WorkspaceIdHeader'
    post:
      operationId: sendSupportMessage
      summary: Persist a question and queue one generation
      x-required-capability: support.use
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendSupportMessageRequest' }
      responses:
        '202':
          description: Message and generation accepted transactionally
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportGenerationAcceptedResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      operationId: listSupportMessages
      summary: List persisted messages of an owned conversation
      x-required-capability: support.use
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Cursor-paginated messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportMessageListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/generations/{id}:
    get:
      operationId: getSupportGeneration
      summary: Get persisted generation state without starting work
      x-required-capability: support.use
      parameters:
        - $ref: '#/components/parameters/SupportResourceId'
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Current generation snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportGenerationResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/generations/{id}/events:
    get:
      operationId: streamSupportGenerationEvents
      summary: Observe an existing generation as server-sent events
      description: The first event is a full snapshot or terminal event. Reconnect never starts a model call.
      x-required-capability: support.use
      x-sse-events:
        snapshot: { $ref: '#/components/schemas/SupportGenerationSnapshotEvent' }
        completed: { $ref: '#/components/schemas/SupportGenerationCompletedEvent' }
        failed: { $ref: '#/components/schemas/SupportGenerationFailedEvent' }
      parameters:
        - $ref: '#/components/parameters/SupportResourceId'
        - $ref: '#/components/parameters/WorkspaceIdHeader'
        - in: header
          name: Last-Event-ID
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: SSE stream; id is the generation-local sequence
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
            X-Accel-Buffering:
              schema: { type: string, example: 'no' }
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SupportGenerationSnapshotEvent'
                  - $ref: '#/components/schemas/SupportGenerationCompletedEvent'
                  - $ref: '#/components/schemas/SupportGenerationFailedEvent'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/generations/{id}/retry:
    post:
      operationId: retrySupportGeneration
      summary: Create an explicit new attempt for the latest failed generation
      x-required-capability: support.use
      parameters:
        - $ref: '#/components/parameters/SupportResourceId'
        - $ref: '#/components/parameters/WorkspaceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetrySupportGenerationRequest' }
      responses:
        '202':
          description: Retry generation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportGenerationAcceptedResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /support/messages/{id}/feedback:
    post:
      operationId: upsertSupportMessageFeedback
      summary: Upsert feedback for an owned completed assistant message
      x-required-capability: support.use
      parameters:
        - $ref: '#/components/parameters/SupportResourceId'
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportFeedbackRequest' }
      responses:
        '200':
          description: Feedback stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportFeedbackResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    UserIdAuth:
      type: apiKey
      in: header
      name: X-User-Id
      description: Authenticated user identifier
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    WorkspaceIdHeader:
      in: header
      name: X-Workspace-Id
      required: true
      description: Current workspace selected by the authenticated user
      schema: { type: string }
    SupportResourceId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      in: query
      name: cursor
      required: false
      schema: { type: string, nullable: true }
    PerPage:
      in: query
      name: per_page
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthenticated:
      description: Session is missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Current membership lacks support.use
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource is absent or not owned in the current workspace
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Idempotency payload or generation lifecycle conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Admission, concurrency, or budget limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:

    DatasetType:
      type: string
      enum: [sales, inventory]
    ImportStatus:
      type: string
      enum: [pending, validating, processing, completed, completed_with_errors, failed]
    SourceFormat:
      type: string
      enum: [csv, json]
    ImportBatchSummary:
      type: object
      required: [id, workspace_id, dataset_type, source_format, original_filename, status, total_rows, processed_rows, successful_rows, failed_rows, created_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        dataset_type:
          $ref: '#/components/schemas/DatasetType'
        source_format:
          $ref: '#/components/schemas/SourceFormat'
        original_filename:
          type: string
        status:
          $ref: '#/components/schemas/ImportStatus'
        total_rows:
          type: integer
        processed_rows:
          type: integer
        successful_rows:
          type: integer
        failed_rows:
          type: integer
        progress_percentage:
          type: number
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    ImportBatchListResponse:
      type: object
      required: [items, total, page, per_page, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportBatchSummary'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
      additionalProperties: false
    ImportBatchDetail:
      type: object
      required: [id, workspace_id, dataset_type, source_format, original_filename, status, total_rows, processed_rows, successful_rows, failed_rows, stored_file_path, created_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        dataset_type:
          $ref: '#/components/schemas/DatasetType'
        source_format:
          $ref: '#/components/schemas/SourceFormat'
        original_filename:
          type: string
        status:
          $ref: '#/components/schemas/ImportStatus'
        total_rows:
          type: integer
        processed_rows:
          type: integer
        successful_rows:
          type: integer
        failed_rows:
          type: integer
        progress_percentage:
          type: number
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        stored_file_path:
          type: string
      additionalProperties: false
    ImportBatchDetailResponse:
      type: object
      required: [batch]
      properties:
        batch:
          $ref: '#/components/schemas/ImportBatchDetail'
      additionalProperties: false
    ImportFailureItem:
      type: object
      required: [id, row_number, error_message, created_at]
      properties:
        id:
          type: string
        row_number:
          type: integer
        field:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    ImportFailureListResponse:
      type: object
      required: [items, total, page, per_page, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportFailureItem'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
      additionalProperties: false
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [analytics] }
        version: { type: string, enum: [v1] }
    UserResponse:
      type: object
      additionalProperties: false
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    WorkspaceRole:
      type: string
      enum: [owner, member, viewer]
    WorkspaceCapability:
      type: string
      enum:
        - analytics.view
        - dashboards.view
        - dashboards.manage
        - imports.view
        - imports.manage
        - alerts.view
        - alerts.manage
        - support.use
        - workspace.members.manage
    WorkspaceMemberResponse:
      type: object
      additionalProperties: false
      required: [user, role]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    WorkspaceMemberListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMemberResponse'
    ChangeWorkspaceMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    ChangeWorkspaceMemberRoleResponse:
      type: object
      additionalProperties: false
      required: [member]
      properties:
        member:
          $ref: '#/components/schemas/WorkspaceMemberResponse'
    WorkspaceResponse:
      type: object
      additionalProperties: false
      required: [id, name, slug, role, capabilities]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceCapability'
    WorkspaceListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceResponse'
    CurrentWorkspaceResponse:
      type: object
      additionalProperties: false
      required: [user, workspace]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        workspace:
          $ref: '#/components/schemas/WorkspaceResponse'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string }
    SalesOverviewResponse:
      type: object
      additionalProperties: false
      required: [summary, trend, categories, regions]
      properties:
        summary:
          $ref: '#/components/schemas/SalesSummary'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/SalesTrendPoint'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SalesCategoryBreakdown'
        regions:
          type: array
          items:
            $ref: '#/components/schemas/SalesRegionBreakdown'
    SalesSummary:
      type: object
      additionalProperties: false
      required: [total_revenue, order_count, average_order_value, gross_profit, margin_rate]
      properties:
        total_revenue: { type: number, format: float }
        order_count: { type: integer }
        average_order_value: { type: number, format: float }
        gross_profit: { type: number, format: float }
        margin_rate: { type: number, format: float }
    SalesTrendPoint:
      type: object
      additionalProperties: false
      required: [date, revenue, order_count]
      properties:
        date: { type: string, format: date }
        revenue: { type: number, format: float }
        order_count: { type: integer }
    SalesCategoryBreakdown:
      type: object
      additionalProperties: false
      required: [category_id, category_name, revenue, order_count, revenue_share]
      properties:
        category_id: { type: string }
        category_name: { type: string }
        revenue: { type: number, format: float }
        order_count: { type: integer }
        revenue_share: { type: number, format: float }
    SalesRegionBreakdown:
      type: object
      additionalProperties: false
      required: [region_id, region_name, region_code, revenue, order_count, revenue_share]
      properties:
        region_id: { type: string }
        region_name: { type: string }
        region_code: { type: string }
        revenue: { type: number, format: float }
        order_count: { type: integer }
        revenue_share: { type: number, format: float }
    SalesFilterOptionsResponse:
      type: object
      additionalProperties: false
      required: [categories, regions, min_date, max_date]
      properties:
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        regions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, code]
            properties:
              id: { type: string }
              name: { type: string }
              code: { type: string }
        min_date: { type: string, format: date }
        max_date: { type: string, format: date }
    PaginationMetadata:
      type: object
      additionalProperties: false
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    SalesRecordItem:
      type: object
      additionalProperties: false
      required: [id, order_id, order_number, order_date, product_id, product_name, product_sku, category_id, category_name, region_id, region_name, brand_name, quantity, unit_price, total_price, gross_profit, status]
      properties:
        id: { type: string }
        order_id: { type: string }
        order_number: { type: string }
        order_date: { type: string, format: date }
        product_id: { type: string }
        product_name: { type: string }
        product_sku: { type: string }
        category_id: { type: string }
        category_name: { type: string }
        region_id: { type: string }
        region_name: { type: string }
        brand_name: { type: string }
        quantity: { type: integer }
        unit_price: { type: number, format: float }
        total_price: { type: number, format: float }
        gross_profit: { type: number, format: float }
        status: { type: string }
    SalesRecordsResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesRecordItem'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
    InventorySummary:
      type: object
      additionalProperties: false
      required:
        - total_items
        - total_quantity_on_hand
        - total_quantity_reserved
        - total_quantity_available
        - total_inventory_value
        - critical_count
        - overstock_count
        - out_of_stock_count
        - optimal_count
        - average_days_of_stock
      properties:
        total_items:
          type: integer
        total_quantity_on_hand:
          type: integer
        total_quantity_reserved:
          type: integer
        total_quantity_available:
          type: integer
        total_inventory_value:
