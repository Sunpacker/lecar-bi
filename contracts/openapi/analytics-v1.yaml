openapi: 3.0.3
info:
  title: AutoBI Analytics API
  version: 1.0.0
  description: Public API boundary for AutoBI analytics service.
  license:
    name: Proprietary
servers:
  - url: /api/v1
security:
  - UserIdAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Technical health check
      security: []
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /me:
    get:
      operationId: getCurrentUser
      summary: Get current authenticated user profile
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid user identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces:
    get:
      operationId: listAccessibleWorkspaces
      summary: List all workspaces accessible by the current user
      responses:
        '200':
          description: List of accessible workspaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/current:
    get:
      operationId: getCurrentWorkspace
      summary: Get currently selected workspace for the user
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
      responses:
        '200':
          description: Current workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentWorkspaceResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - user does not belong to the requested workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/{id}:
    get:
      operationId: getWorkspaceById
      summary: Get workspace details by identifier
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Workspace identifier
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - cross-workspace access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/sales/overview:
    get:
      operationId: getSalesOverview
      summary: Get aggregated sales summary, trends, and breakdowns
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
        - in: query
          name: date_from
          required: false
          schema:
            type: string
            format: date
          description: Start of date filter range (YYYY-MM-DD)
        - in: query
          name: date_to
          required: false
          schema:
            type: string
            format: date
          description: End of date filter range (YYYY-MM-DD)
        - in: query
          name: category_id
          required: false
          schema:
            type: string
          description: Filter by specific category ID
        - in: query
          name: region_id
          required: false
          schema:
            type: string
          description: Filter by specific region ID
      responses:
        '200':
          description: Aggregated sales overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOverviewResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/sales/filters:
    get:
      operationId: getSalesFilterOptions
      summary: Get available categories, regions, and date boundaries for sales filters
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
      responses:
        '200':
          description: Filter options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesFilterOptionsResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/sales/records:
    get:
      operationId: getSalesRecords
      summary: Get paginated and sorted detail sales records for drill-down
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
          description: Optional requested workspace identifier
        - in: query
          name: date_from
          required: false
          schema:
            type: string
            format: date
          description: Start of date filter range (YYYY-MM-DD)
        - in: query
          name: date_to
          required: false
          schema:
            type: string
            format: date
          description: End of date filter range (YYYY-MM-DD)
        - in: query
          name: category_id
          required: false
          schema:
            type: string
          description: Filter by specific category ID
        - in: query
          name: region_id
          required: false
          schema:
            type: string
          description: Filter by specific region ID
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page
        - in: query
          name: sort_by
          required: false
          schema:
            type: string
            enum: [order_date, order_number, product_name, total_price, quantity, gross_profit]
            default: order_date
          description: Field to sort records by
        - in: query
          name: sort_direction
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction
      responses:
        '200':
          description: Paginated detail sales records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesRecordsResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    UserIdAuth:
      type: apiKey
      in: header
      name: X-User-Id
      description: Authenticated user identifier
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [analytics] }
        version: { type: string, enum: [v1] }
    UserResponse:
      type: object
      additionalProperties: false
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    WorkspaceResponse:
      type: object
      additionalProperties: false
      required: [id, name, slug, role]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, member] }
    WorkspaceListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceResponse'
    CurrentWorkspaceResponse:
      type: object
      additionalProperties: false
      required: [user, workspace]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        workspace:
          $ref: '#/components/schemas/WorkspaceResponse'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string }
    SalesOverviewResponse:
      type: object
      additionalProperties: false
      required: [summary, trend, categories, regions]
      properties:
        summary:
          $ref: '#/components/schemas/SalesSummary'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/SalesTrendPoint'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SalesCategoryBreakdown'
        regions:
          type: array
          items:
            $ref: '#/components/schemas/SalesRegionBreakdown'
    SalesSummary:
      type: object
      additionalProperties: false
      required: [total_revenue, order_count, average_order_value, gross_profit, margin_rate]
      properties:
        total_revenue: { type: number, format: float }
        order_count: { type: integer }
        average_order_value: { type: number, format: float }
        gross_profit: { type: number, format: float }
        margin_rate: { type: number, format: float }
    SalesTrendPoint:
      type: object
      additionalProperties: false
      required: [date, revenue, order_count]
      properties:
        date: { type: string, format: date }
        revenue: { type: number, format: float }
        order_count: { type: integer }
    SalesCategoryBreakdown:
      type: object
      additionalProperties: false
      required: [category_id, category_name, revenue, order_count, revenue_share]
      properties:
        category_id: { type: string }
        category_name: { type: string }
        revenue: { type: number, format: float }
        order_count: { type: integer }
        revenue_share: { type: number, format: float }
    SalesRegionBreakdown:
      type: object
      additionalProperties: false
      required: [region_id, region_name, region_code, revenue, order_count, revenue_share]
      properties:
        region_id: { type: string }
        region_name: { type: string }
        region_code: { type: string }
        revenue: { type: number, format: float }
        order_count: { type: integer }
        revenue_share: { type: number, format: float }
    SalesFilterOptionsResponse:
      type: object
      additionalProperties: false
      required: [categories, regions, min_date, max_date]
      properties:
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        regions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, code]
            properties:
              id: { type: string }
              name: { type: string }
              code: { type: string }
        min_date: { type: string, format: date }
        max_date: { type: string, format: date }
    PaginationMetadata:
      type: object
      additionalProperties: false
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    SalesRecordItem:
      type: object
      additionalProperties: false
      required: [id, order_id, order_number, order_date, product_id, product_name, product_sku, category_id, category_name, region_id, region_name, brand_name, quantity, unit_price, total_price, gross_profit, status]
      properties:
        id: { type: string }
        order_id: { type: string }
        order_number: { type: string }
        order_date: { type: string, format: date }
        product_id: { type: string }
        product_name: { type: string }
        product_sku: { type: string }
        category_id: { type: string }
        category_name: { type: string }
        region_id: { type: string }
        region_name: { type: string }
        brand_name: { type: string }
        quantity: { type: integer }
        unit_price: { type: number, format: float }
        total_price: { type: number, format: float }
        gross_profit: { type: number, format: float }
        status: { type: string }
    SalesRecordsResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesRecordItem'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
