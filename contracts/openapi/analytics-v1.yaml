      type: object
      additionalProperties: false
      required: [client_message_id, content]
      properties:
        client_message_id: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 4000 }
    RetrySupportGenerationRequest:
      type: object
      additionalProperties: false
      required: [retry_request_id]
      properties:
        retry_request_id: { type: string, format: uuid }
    SupportFeedbackRequest:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating:
          type: string
          enum: [helpful, not_helpful]
    SupportConversation:
      type: object
      additionalProperties: false
      required: [id, workspace_id, title, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SupportConversationResponse:
      type: object
      additionalProperties: false
      required: [conversation]
      properties:
        conversation: { $ref: '#/components/schemas/SupportConversation' }
    SupportConversationListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SupportConversation' }
        next_cursor: { type: string, nullable: true }
    SupportGenerationStatus:
      type: string
      enum: [queued, running, completed, failed]
    SupportGenerationOutcome:
      type: string
      enum: [answered, no_context]
      nullable: true
    SupportCitation:
      type: object
      additionalProperties: false
      required: [document_id, revision, chunk_id, title, available]
      properties:
        document_id: { type: string }
        revision: { type: string }
        chunk_id: { type: string, format: uuid }
        title: { type: string }
        url: { type: string, nullable: true }
        anchor: { type: string, nullable: true }
        available: { type: boolean }
    SupportGeneration:
      type: object
      additionalProperties: false
      required: [id, conversation_id, user_message_id, assistant_message_id, attempt, status, sequence, text, citations, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        user_message_id: { type: string, format: uuid }
        assistant_message_id: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/SupportGenerationStatus' }
        outcome: { $ref: '#/components/schemas/SupportGenerationOutcome' }
        sequence: { type: integer, minimum: 0 }
        text: { type: string }
        error_code: { type: string, nullable: true }
        retryable: { type: boolean, default: false }
        citations:
          type: array
          items: { $ref: '#/components/schemas/SupportCitation' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SupportGenerationResponse:
      type: object
      additionalProperties: false
      required: [generation]
      properties:
        generation: { $ref: '#/components/schemas/SupportGeneration' }
    SupportGenerationAcceptedResponse:
      type: object
      additionalProperties: false
      required: [message_id, assistant_message_id, generation_id]
      properties:
        message_id: { type: string, format: uuid }
        assistant_message_id: { type: string, format: uuid }
        generation_id: { type: string, format: uuid }
    SupportMessage:
      type: object
      additionalProperties: false
      required: [id, conversation_id, role, content, position, citations, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        position: { type: integer, minimum: 1 }
        generation_id: { type: string, format: uuid, nullable: true }
        generation_status: { $ref: '#/components/schemas/SupportGenerationStatus' }
        outcome: { $ref: '#/components/schemas/SupportGenerationOutcome' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/SupportCitation' }
        created_at: { type: string, format: date-time }
    SupportMessageListResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SupportMessage' }
        next_cursor: { type: string, nullable: true }
    SupportFeedbackResponse:
      type: object
      additionalProperties: false
      required: [message_id, rating, updated_at]
      properties:
        message_id: { type: string, format: uuid }
        rating: { type: string, enum: [helpful, not_helpful] }
        updated_at: { type: string, format: date-time }
    SupportGenerationSnapshotEvent:
      type: object
      additionalProperties: false
      required: [generation_id, sequence, status, text]
      properties:
        generation_id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/SupportGenerationStatus' }
        text: { type: string }
    SupportGenerationCompletedEvent:
      allOf:
        - $ref: '#/components/schemas/SupportGenerationSnapshotEvent'
        - type: object
          required: [outcome, citations]
          properties:
            outcome: { type: string, enum: [answered, no_context] }
            citations:
              type: array
              items: { $ref: '#/components/schemas/SupportCitation' }
    SupportGenerationFailedEvent:
      allOf:
        - $ref: '#/components/schemas/SupportGenerationSnapshotEvent'
        - type: object
          required: [error_code, retryable]
          properties:
            error_code: { type: string }
            retryable: { type: boolean }
