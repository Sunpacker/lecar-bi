name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  frontend-and-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run contracts:validate
      - run: npm run api:generate
      - run: git diff --exit-code -- src/shared/api/generated/schema.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high || true
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit --locked --no-interaction || true
      - run: composer lint
        env:
          APP_ENV: testing
      - run: composer test

  notification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit --locked --no-interaction || true
      - run: composer lint
      - run: composer test

  container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml build frontend backend notification

  clean-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml up -d postgres notification-postgres
      - run: |
          until docker compose --env-file infra/.env.example -f infra/docker-compose.yml exec -T postgres pg_isready -U autobi -d autobi; do
            sleep 1
          done
          until docker compose --env-file infra/.env.example -f infra/docker-compose.yml exec -T notification-postgres pg_isready -U notification -d notification; do
            sleep 1
          done
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml run --rm backend php artisan migrate --force
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml run --rm notification php artisan migrate --force
      - if: always()
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml down --volumes

  integration:
    runs-on: ubuntu-latest
    needs: [frontend-and-contracts, backend, notification, container-builds, clean-migrations]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml up --build --detach
      - run: ./scripts/verify-integration.sh
      - run: ./scripts/restore-drill.sh
      - if: always()
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml down --volumes

  publish-vps-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable images
        shell: bash
        run: |
          set -euo pipefail
          repository=${GITHUB_REPOSITORY,,}
          source="https://github.com/$GITHUB_REPOSITORY"
          for service in backend notification; do
            image="ghcr.io/$repository/$service:sha-$GITHUB_SHA"
            docker build --label "org.opencontainers.image.source=$source" --tag "$image" "$service"
            docker push "$image"
          done

  deploy-vps:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-vps-images
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: production-vps
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PATH: ${{ vars.VPS_PATH }}
      VPS_PROJECT: ${{ vars.VPS_PROJECT }}
      VPS_ENV_FILE: ${{ vars.VPS_ENV_FILE }}
      VPS_BACKUP_DIR: ${{ vars.VPS_BACKUP_DIR }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Check current main and SSH configuration
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; skipping this release'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$VPS_PORT" =~ ^[0-9]+$ && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          [[ "$VPS_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$VPS_ENV_FILE" =~ ^/[a-zA-Z0-9_./-]+$ && "$VPS_BACKUP_DIR" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          [[ "$VPS_PROJECT" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ && -n "$VPS_KNOWN_HOSTS" && -n "$VPS_SSH_KEY" ]] || exit 1
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
      - name: Transfer release package and deploy
        if: steps.preflight.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/deploy_key
          ssh_options=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$VPS_PORT")
          scp_options=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -P "$VPS_PORT")
          release_dir="$VPS_PATH/releases/$GITHUB_SHA"
          archive="$VPS_PATH/incoming/$GITHUB_SHA.tar.gz"
          tar -czf release.tar.gz infra/docker-compose.vps.yml infra/observability scripts/backup-db.sh scripts/restore-db.sh scripts/deploy-vps.sh
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_PATH/incoming' '$release_dir'"
          scp "${scp_options[@]}" release.tar.gz "$VPS_USER@$VPS_HOST:$archive"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "tar -xzf '$archive' -C '$release_dir' && rm -f '$archive' && bash '$release_dir/scripts/deploy-vps.sh' --sha '$GITHUB_SHA' --release-dir '$release_dir' --project '$VPS_PROJECT' --env-file '$VPS_ENV_FILE' --backup-dir '$VPS_BACKUP_DIR' --repository '$GITHUB_REPOSITORY'"
