name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  frontend-and-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run contracts:validate
      - run: npm run api:generate
      - run: git diff --exit-code -- src/shared/api/generated/schema.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer lint
      - run: composer test

  container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml build frontend
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml build backend

  integration:
    runs-on: ubuntu-latest
    needs: [frontend-and-contracts, backend, container-builds]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml up --build --detach
      - run: ./scripts/verify-integration.sh
      - if: always()
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml down --volumes
